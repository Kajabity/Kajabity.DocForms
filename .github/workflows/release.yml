name: Release

on:
  push:
    tags:
      - '0.4.1'

permissions:
  contents: read

jobs:
  verify:
    name: Build, test and verify package
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne '0.4.1') { throw 'This workflow is prepared only for 0.4.1.' }
          $tagCommit = git rev-parse "$($env:GITHUB_REF_NAME)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the release tag to a commit.' }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main.' }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release tag must point to a commit on main.' }
          "ReleaseVersion=$env:GITHUB_REF_NAME" >> $env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        shell: pwsh
        run: ./.github/scripts/restore-packages.ps1

      - name: Build library, tests and samples
        shell: pwsh
        run: |
          msbuild Kajabity.DocForms.sln /m /p:Configuration=Release /p:ReleaseVersion=$env:ReleaseVersion /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw 'Release solution build failed.' }

      - name: Verify assembly versions
        shell: pwsh
        run: |
          foreach ($path in @('Kajabity.DocForms/bin/Release/Kajabity.DocForms.dll',
                               'Kajabity.DocForms/bin/Release/net10.0-windows/Kajabity.DocForms.dll')) {
            $fullPath = (Resolve-Path $path).Path
            $assemblyVersion = [Reflection.AssemblyName]::GetAssemblyName($fullPath).Version.ToString()
            $fileVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($fullPath)
            # Patch releases keep the 0.4 strong-name assembly version.
            if ($assemblyVersion -ne '0.4.0.0' -or $fileVersion.FileVersion -ne '0.4.1.0' -or
                $fileVersion.ProductVersion -ne '0.4.1') {
              throw "Unexpected assembly, file or informational version in $path."
            }
          }

      - name: Test .NET Framework 4.8
        shell: pwsh
        run: |
          dotnet test Kajabity.DocForms.Test/Kajabity.DocForms.Test.csproj --framework net48 --configuration Release --no-build --settings Kajabity.DocForms.Test/DocForms.runsettings
          if ($LASTEXITCODE -ne 0) { throw '.NET Framework 4.8 tests failed.' }

      - name: Test .NET 10 for Windows
        shell: pwsh
        run: |
          dotnet test Kajabity.DocForms.Test/Kajabity.DocForms.Test.csproj --framework net10.0-windows --configuration Release --no-build --settings Kajabity.DocForms.Test/DocForms.runsettings
          if ($LASTEXITCODE -ne 0) { throw '.NET 10 tests failed.' }

      - name: Pack and validate release files
        shell: pwsh
        run: |
          dotnet pack Kajabity.DocForms/Kajabity.DocForms.csproj `
            --configuration Release --no-build --no-restore `
            -p:ReleaseVersion=$env:ReleaseVersion -p:PackageVersion=$env:ReleaseVersion `
            --output artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Release package creation failed.' }
          ./.github/scripts/validate-package.ps1 `
            -PackagePath artifacts/Kajabity.DocForms.0.4.1.nupkg `
            -SymbolPackagePath artifacts/Kajabity.DocForms.0.4.1.snupkg `
            -ExpectedVersion 0.4.1
          $lines = foreach ($file in @('Kajabity.DocForms.0.4.1.nupkg', 'Kajabity.DocForms.0.4.1.snupkg')) {
            $hash = (Get-FileHash (Join-Path artifacts $file) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $lines | Set-Content artifacts/SHA256SUMS.txt

      - name: Upload verified release files
        uses: actions/upload-artifact@v7
        with:
          name: kdf-0.4.1
          path: artifacts/
          if-no-files-found: error

  publish-nuget:
    name: Publish verified package to NuGet.org
    needs: verify
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out validation script
        uses: actions/checkout@v7

      - name: Download verified release files
        uses: actions/download-artifact@v8
        with:
          name: kdf-0.4.1
          path: artifacts

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Revalidate downloaded files
        shell: pwsh
        run: |
          ./.github/scripts/validate-package.ps1 `
            -PackagePath artifacts/Kajabity.DocForms.0.4.1.nupkg `
            -SymbolPackagePath artifacts/Kajabity.DocForms.0.4.1.snupkg `
            -ExpectedVersion 0.4.1
          foreach ($line in Get-Content artifacts/SHA256SUMS.txt) {
            if ($line -notmatch '^([a-f0-9]{64})  (.+)$') { throw 'Malformed SHA256SUMS.txt.' }
            $actual = (Get-FileHash (Join-Path artifacts $Matches[2]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "Checksum mismatch: $($Matches[2])." }
          }

      - name: Authenticate to NuGet.org with OIDC
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: kajabity

      - name: Publish package and matching symbols
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'NuGet Trusted Publishing did not return a temporary key.'
          }
          dotnet nuget push artifacts/Kajabity.DocForms.0.4.1.nupkg `
            --api-key $env:NUGET_API_KEY `
            --symbol-api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet.org publishing failed; inspect package and symbol status before retrying.' }

  github-release:
    name: Create GitHub Release from verified files
    needs: publish-nuget
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v7

      - name: Download verified release files
        uses: actions/download-artifact@v8
        with:
          name: kdf-0.4.1
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Kajabity.DocForms 0.4.1
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/Kajabity.DocForms.0.4.1.nupkg
            artifacts/Kajabity.DocForms.0.4.1.snupkg
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
