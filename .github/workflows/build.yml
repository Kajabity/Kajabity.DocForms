name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        shell: pwsh
        run: ./.github/scripts/restore-packages.ps1

      - name: Build solution
        run: msbuild Kajabity.DocForms.sln /m /p:Configuration=Release /v:minimal /nologo

      - name: Run NUnit tests
        shell: pwsh
        run: |
          $testAssembly = 'Kajabity.DocForms.Test\bin\Release\Kajabity.DocForms.Test.dll'
          $adapterPath = 'packages\NUnit3TestAdapter.6.3.0\build\net462'
          $settingsPath = 'Kajabity.DocForms.Test\DocForms.runsettings'
          $discoveredTests = dotnet vstest $testAssembly "/TestAdapterPath:$adapterPath" "/Settings:$settingsPath" /ListTests
          if ($LASTEXITCODE -ne 0 -or ($discoveredTests -join "`n") -notmatch 'The following Tests are available:') {
            throw 'NUnit test discovery failed.'
          }

          dotnet vstest $testAssembly "/TestAdapterPath:$adapterPath" "/Settings:$settingsPath" /Platform:x64 /Logger:Console
          if ($LASTEXITCODE -ne 0) {
            throw 'NUnit test execution failed.'
          }
