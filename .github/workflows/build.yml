name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        shell: pwsh
        run: ./.github/scripts/restore-packages.ps1

      - name: Build solution
        run: msbuild Kajabity.DocForms.sln /m /p:Configuration=Release /v:minimal /nologo

      - name: Run NUnit tests on .NET Framework 4.8
        shell: pwsh
        run: |
          dotnet test Kajabity.DocForms.Test/Kajabity.DocForms.Test.csproj --framework net48 --configuration Release --no-build --settings Kajabity.DocForms.Test/DocForms.runsettings
          if ($LASTEXITCODE -ne 0) {
            throw '.NET Framework 4.8 NUnit tests failed.'
          }

      - name: Run NUnit tests on .NET 10 for Windows
        shell: pwsh
        run: |
          dotnet test Kajabity.DocForms.Test/Kajabity.DocForms.Test.csproj --framework net10.0-windows --configuration Release --no-build --settings Kajabity.DocForms.Test/DocForms.runsettings
          if ($LASTEXITCODE -ne 0) {
            throw '.NET 10 NUnit tests failed.'
          }

      - name: Pack and validate NuGet package
        shell: pwsh
        run: |
          dotnet pack Kajabity.DocForms/Kajabity.DocForms.csproj --configuration Release --no-build --no-restore --output artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Package creation failed.' }
          ./.github/scripts/validate-package.ps1 `
            -PackagePath artifacts/Kajabity.DocForms.0.4.0.nupkg `
            -SymbolPackagePath artifacts/Kajabity.DocForms.0.4.0.snupkg `
            -ExpectedVersion 0.4.0
